name: Frontend - Build

on:
  push:
    branches: [ main ]
    paths: [ "frontend/**", ".github/workflows/frontend-build.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "frontend/**", ".github/workflows/frontend-build.yml" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (exactas, desde package-lock.json)
        run: npm ci

      - name: Lint (incluye las reglas de arquitectura de carpetas)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build de producción (verifica tipos)
        run: npm run build

      - name: Paquetes vulnerables en producción
        run: npm audit --omit=dev --audit-level=high
